// IDL文件
syntax = "proto3";

message UserRequest {
    string username = 1;
    string password = 2;
};

message UserResponse {
    bool success = 1;
    optional int32 id = 2;
    optional string username = 3;
    optional string createdAt = 4;
    optional string token = 5;
    // 失败原因，供调用方区分「用户名已存在」「密码错误」「服务不可用」等
    optional string err_msg = 6;
}

// 定义 User 服务
service UserService {
    rpc sign_up(UserRequest) returns (UserResponse);
    rpc sign_in(UserRequest) returns (UserResponse);
}


